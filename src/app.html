<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121214" />
    <meta name="description" content="FACEIT CS2 stats and live matches for our group of friends." />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <script>
      // Dark unless the visitor chose light before; the OS preference is deliberately ignored.
      try {
        const saved = localStorage.getItem('stackline-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
